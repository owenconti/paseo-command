<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Send a screen capture · Paseo Command</title>
    <script>
      // The macOS app's send panel (src/capture/): light or dark as the system is.
      document.documentElement.dataset.theme =
        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/capture/main.tsx"></script>
  </body>
</html>
